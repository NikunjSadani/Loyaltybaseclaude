name = "gifsy-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Route all four subdomains through this worker.
# zone_name tells Cloudflare which zone owns the domain.
routes = [
  { pattern = "api.gifsy.in/*",      zone_name = "gifsy.in" },
  { pattern = "platform.gifsy.in/*", zone_name = "gifsy.in" },
  { pattern = "deoleo.gifsy.in/*",   zone_name = "gifsy.in" },
  { pattern = "clientb.gifsy.in/*",  zone_name = "gifsy.in" },
  { pattern = "deoleoloyalty.gifsy.in/*", zone_name = "gifsy.in" },
]
