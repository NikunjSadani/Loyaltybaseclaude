name = "gifsy-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains are configured in the Cloudflare dashboard after deploying,
# not in wrangler.toml, so that the nameserver cutover can happen independently.
# Dashboard path: Workers & Pages → gifsy-proxy → Settings → Triggers → Custom Domains
#
# Domains to add:
#   api.gifsy.in
#   platform.gifsy.in
#   deoleo.gifsy.in
#   clientb.gifsy.in
#   gifsy.in
