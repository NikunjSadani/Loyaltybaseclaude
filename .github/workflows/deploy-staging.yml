name: Deploy — Staging (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  PROJECT_ID:   gifsy-platform
  REGION:       asia-south1
  AR_REPO:      gifsy-images
  SQL_INSTANCE: gifsy-platform:asia-south1:gifsy-db

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, platform]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Each app generates from its OWN prisma/schema.prisma (platform + api each
        # have one post-split). The cross-app fallback (--schema=../api/prisma) was
        # removed in Phase S S7 — it was dead (both apps have a local schema). The
        # -f guard remains so the step no-ops cleanly if a schema is ever absent
        # (e.g. after S8 deletes platform's schema when it becomes a pure proxy FE).
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            npm test -- --forceExit --no-coverage
          else
            npm test
          fi
        env:
          DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/test"
          JWT_SECRET: "ci-test-secret"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          NODE_ENV: test

  # ── Build & Deploy API (staging) ─────────────────────────────────────────────
  deploy-api-staging:
    name: Deploy API → gifsy-api-staging
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # PREFLIGHT — runs FIRST, before the image build and BEFORE the staging DB migrations (mirrors deploy.yml).
      # The "Deploy API to Cloud Run staging" step binds SALES_IMPORT_DRAIN_SECRET_STAGING via --set-secrets; if
      # it is missing that step fails AFTER migrations already ran. Fail HERE instead, with nothing changed.
      # METADATA-ONLY: `gcloud secrets versions describe` reads a version's state, NEVER its value. The deployer
      # SA (GCP_SA_KEY = gifsy-deployer) needs roles/secretmanager.viewer (metadata only) — terraform/iam.tf
      # `deployer_secret_viewer`; one-time grant in platform/docs/plans/BAJAJ-PROD-GO-LIVE-CHECKLIST.md § F3 runbook.
      - name: Preflight — required Secret Manager secrets exist (metadata only)
        run: |
          missing=0
          for s in SALES_IMPORT_DRAIN_SECRET_STAGING VOUCHER_DISPERSAL_DRAIN_SECRET_STAGING INTERNAL_PROXY_SECRET_STAGING; do
            state="$(gcloud secrets versions describe latest --secret="$s" --project="${{ env.PROJECT_ID }}" --format='value(state)' 2>/dev/null || true)"
            if [ "$state" != "ENABLED" ]; then
              echo "::error::Secret Manager secret '$s' is missing, has no ENABLED latest version, or is not visible to the deployer SA (needs roles/secretmanager.viewer). Create it (owner, console) BEFORE deploying — see SALES-IMPORT-PIPELINE-PLAN.md §14 / BAJAJ-PROD-GO-LIVE-CHECKLIST.md § F3 runbook. Nothing was built, migrated or deployed."
              missing=1
            else
              echo "ok: $s (latest version ENABLED)"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push API staging image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging-${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging \
            ./api
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging-${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging

      # NOTE: prod migrations are NOT auto-wired here — the first prod deploy with the
      # squashed Prisma baseline requires a one-time manual reconcile. See the gated
      # cutover runbook before touching deploy.yml.
      - name: Run DB migrations (staging)
        run: |
          gcloud run jobs deploy gifsy-migrate-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=npx \
            --args=prisma,migrate,deploy \
            --set-secrets=DATABASE_URL=DATABASE_URL_STAGING:latest \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=gifsy-api-sa@gifsy-platform.iam.gserviceaccount.com \
            --execute-now --wait

      # SALES IMPORT worker (plan SALES-IMPORT-PIPELINE-PLAN.md §14, D-4). Deploy-only (NO --execute-now):
      # the API starts executions via the Cloud Run Admin API `jobs/gifsy-sales-import-staging:run`
      # (SALES_IMPORT_RUNNER=job, no overrides) and the Cloud Scheduler drain is the fallback.
      #   • Runs AFTER the migrate step (sales-import migrations must be applied before the worker can run)
      #     and BEFORE the API deploy, with the SAME image tag as the API — the worker never runs a stale image.
      #   • Network / Cloud SQL / service-account wiring is copied from gifsy-migrate-staging above. The job
      #     runs as gifsy-api-sa (already has cloudsql.client, secretAccessor, storage.objectAdmin).
      #   • Heap: 2Gi job, node --max-old-space-size=1700 (worker.main.ts also enforces it via worker-heap.ts).
      #   • ONE-TIME infra (owner-gated, NOT done by this workflow): IAM binding roles/run.jobsExecutor for
      #     gifsy-api-sa ON THIS JOB (after the first deploy creates it), the SALES_IMPORT_DRAIN_SECRET_STAGING
      #     secret, and the Cloud Scheduler drain job. Without the IAM binding the API's kick 403s, logs a
      #     warning and the import stays QUEUED (fail-safe) — it never breaks the API.
      - name: Deploy Sales Import worker job (staging)
        run: |
          gcloud run jobs deploy gifsy-sales-import-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=node \
            --args=--max-old-space-size=1700,dist/sales-import/worker.main.js \
            --memory=2Gi \
            --cpu=1 \
            --task-timeout=3600 \
            --max-retries=1 \
            --tasks=1 \
            --set-env-vars="NODE_ENV=production,GCP_REGION=${{ env.REGION }},NODE_OPTIONS=--max-old-space-size=1700" \
            --set-secrets="DATABASE_URL=DATABASE_URL_STAGING:latest,GCS_BUCKET=GCS_BUCKET:latest,GCP_PROJECT_ID=GCP_PROJECT_ID:latest" \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=gifsy-api-sa@gifsy-platform.iam.gserviceaccount.com

      # DOWNLOADS worker (platform/docs/plans/DOWNLOADS-PAGE.md) — prepares heavy report files in the background.
      # Mirrors the Sales Import worker job above EXACTLY (same image tag, network, Cloud SQL, SA, 2Gi + heap 1700),
      # deploy-only (NO --execute-now): the API starts executions via `jobs/gifsy-exports-staging:run`
      # (EXPORTS_RUNNER=job) and, as a fallback, on any Downloads-page poll that sees a stuck request.
      #   • Secrets: only EXISTING ones. JWT_SECRET is needed because some reports (Outlet Master) embed signed
      #     document-view links. NO new secret is required by this job.
      #   • IAM: the NEXT step grants roles/run.jobsExecutor for gifsy-api-sa ON THIS JOB (idempotent). Without it the
      #     API's kick 403s and every heavy request FAILS at once ("Downloads couldn't start on the server…"); the API
      #     itself is never affected. Optional Cloud Scheduler drain → POST /v1/exports/drain (x-drain-secret = the
      #     SALES_IMPORT_DRAIN_SECRET value) — see the runbook.
      - name: Deploy Downloads worker job (staging)
        run: |
          gcloud run jobs deploy gifsy-exports-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=node \
            --args=--max-old-space-size=1700,dist/exports/worker.main.js \
            --memory=2Gi \
            --cpu=1 \
            --task-timeout=3600 \
            --max-retries=1 \
            --tasks=1 \
            --set-env-vars="NODE_ENV=production,GCP_REGION=${{ env.REGION }},NODE_OPTIONS=--max-old-space-size=1700" \
            --set-secrets="DATABASE_URL=DATABASE_URL_STAGING:latest,GCS_BUCKET=GCS_BUCKET:latest,GCP_PROJECT_ID=GCP_PROJECT_ID:latest,JWT_SECRET=JWT_SECRET_STAGING:latest" \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=gifsy-api-sa@gifsy-platform.iam.gserviceaccount.com

      # ⚠️ OWNER APPROVAL REQUIRED before this lands (IAM change on GCP): lets the API (gifsy-api-sa) START executions
      # of the Downloads job — and nothing else (scoped to THIS job only; mirrors the grant already on
      # gifsy-sales-import-staging). Idempotent (re-adding an existing binding is a no-op); the deployer holds
      # roles/run.admin, which includes run.jobs.setIamPolicy.
      - name: Allow the API to start the Downloads worker job (staging)
        run: |
          gcloud run jobs add-iam-policy-binding gifsy-exports-staging \
            --region=${{ env.REGION }} \
            --member=serviceAccount:gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --role=roles/run.jobsExecutor \
            --quiet

      # SALES IMPORT (API side): SALES_IMPORT_RUNNER=job + SALES_IMPORT_JOB + GCP_PROJECT (read by
      # api/src/sales-import/ingest/sales-import-runner.service.ts; GCP_REGION is already set) and
      # SALES_IMPORT_DRAIN_SECRET (read by sales-import-drain.controller.ts; fail-closed 403 when unset).
      #   ⚠️ The Secret Manager secret SALES_IMPORT_DRAIN_SECRET_STAGING MUST exist (and gifsy-api-sa must be able
      #   to read it) BEFORE this lands on develop — a --set-secrets reference to a missing secret fails this
      #   whole API deploy step (the staging API, incl. Deoleo staging UAT, stays on its previous revision).
      #
      # HUBBLE MONEY (Bajaj-only GIFT_CARD auto-issuance):
      #   • HUBBLE_BASE_URL + HUBBLE_CLIENT_ID_STAGING / HUBBLE_CLIENT_SECRET_STAGING are wired below.
      #     Create those two Secret Manager secrets before the next deploy or gcloud will error.
      #   • HUBBLE_WEBHOOK_SECRET is wired below from the WebhookHubbleStaging secret, so the webhook
      #     ENFORCES Hubble's X-Verify HMAC on staging too (its value must equal the portal's Webhook
      #     Signature). The webhook is FAIL-CLOSED everywhere (no dev-bypass): removing this mapping
      #     makes every Hubble webhook call 403.
      #   • The code reads the env-neutral HUBBLE_CLIENT_ID / HUBBLE_CLIENT_SECRET first and falls back
      #     to the *_STAGING names below, so staging is unchanged. PROD binds the neutral names in
      #     deploy.yml (HUBBLE_CLIENT_ID / HUBBLE_CLIENT_SECRET / HUBBLE_WEBHOOK_SECRET + base URL
      #     https://api.myhubble.money). Do NOT add prod secrets here.
      # FUND RECONCILIATION — staging NEVER e-mails clients: FUND_ALERTS_LIVE is not set, and every client low-balance
      #   e-mail goes ONLY to the internal ops inbox below (subject names who it would have reached). It must stay on an
      #   internal domain (REPORTS_RECIPIENT_DOMAINS, default gifsy.in) or nothing is sent. Remove it to send nothing.
      - name: Deploy API to Cloud Run staging
        run: |
          gcloud run deploy gifsy-api-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:staging-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port=4000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --cpu-throttling \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --clear-vpc-connector \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --startup-probe=httpGet.path=/health/ready,httpGet.port=4000,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=30 \
            --set-env-vars="NODE_ENV=production,GCP_REGION=${{ env.REGION }},PLATFORM_DOMAIN=gifsy.in,JWT_EXPIRES_IN=60m,POINTS_TO_INR_RATE=1,MIN_PAYOUT_AMOUNT_PAISE=10000,TDS_SINGLE_TRANSACTION_THRESHOLD_PAISE=3000000,TDS_ANNUAL_THRESHOLD_PAISE=10000000,TDS_RATE_WITH_PAN=1,TDS_RATE_WITHOUT_PAN=2,FIXED_OTP=123456,ALLOW_FIXED_OTP=true,PUSH_WORKER_ENABLED=true,VAPID_SUBJECT=mailto:ops@gifsy.in,REPORTS_FROM_EMAIL=reports@notify.gifsy.in,HUBBLE_BASE_URL=https://api.dev.myhubble.money,SALES_IMPORT_RUNNER=job,SALES_IMPORT_JOB=gifsy-sales-import-staging,EXPORTS_RUNNER=job,EXPORTS_JOB=gifsy-exports-staging,GCP_PROJECT=${{ env.PROJECT_ID }},FUND_ALERTS_TEST_RECIPIENT=ops@gifsy.in" \
            --set-secrets="\
              DATABASE_URL=DATABASE_URL_STAGING:latest,\
              JWT_SECRET=JWT_SECRET_STAGING:latest,\
              INTERNAL_PROXY_SECRET=INTERNAL_PROXY_SECRET_STAGING:latest,\
              MSG91_AUTH_KEY=MSG91_AUTH_KEY:latest,\
              HUBBLE_CLIENT_ID_STAGING=HUBBLE_CLIENT_ID_STAGING:latest,\
              HUBBLE_CLIENT_SECRET_STAGING=HUBBLE_CLIENT_SECRET_STAGING:latest,\
              HUBBLE_WEBHOOK_SECRET=WebhookHubbleStaging:latest,\
              MSG91_SENDER_ID=MSG91_SENDER_ID:latest,\
              MSG91_OTP_TEMPLATE_ID=MSG91_OTP_TEMPLATE_ID:latest,\
              MSG91_SMS_TEMPLATE_ID=MSG91_SMS_TEMPLATE_ID:latest,\
              MSG91_SMTP_PASS=MSG91_SMTP_PASS:latest,\
              REPORTS_RUN_SECRET=REPORTS_RUN_SECRET_STAGING:latest,\
              GCS_BUCKET=GCS_BUCKET:latest,\
              GCP_PROJECT_ID=GCP_PROJECT_ID:latest,\
              VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY_STAGING:latest,\
              VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY_STAGING:latest,\
              PUSH_DRAIN_SECRET=PUSH_DRAIN_SECRET_STAGING:latest,\
              EXPIRE_SWEEP_SECRET=EXPIRE_SWEEP_SECRET_STAGING:latest,\
              KYC_CLEANUP_SECRET=KYC_CLEANUP_SECRET_STAGING:latest,\
              VISIBILITY_REMINDER_SECRET=VISIBILITY_REMINDER_SECRET_STAGING:latest,\
              SALES_IMPORT_DRAIN_SECRET=SALES_IMPORT_DRAIN_SECRET_STAGING:latest,\
              VOUCHER_DISPERSAL_DRAIN_SECRET=VOUCHER_DISPERSAL_DRAIN_SECRET_STAGING:latest,\
              CORS_ORIGINS=CORS_ORIGINS_STAGING:latest"

  # ── Build & Deploy Frontend (staging) ────────────────────────────────────────
  deploy-frontend-staging:
    name: Deploy Frontend → gifsy-frontend-staging
    # Same ordering as prod: never ship a new frontend against an API deploy that failed.
    needs: [test, deploy-api-staging]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push frontend staging image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }} \
            --build-arg NEXT_PUBLIC_PWA_SW_ENABLED=true \
            --build-arg NEXT_PUBLIC_PWA_INSTALL_ENABLED=true \
            --build-arg NEXT_PUBLIC_PWA_PUSH_ENABLED=true \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:staging-${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:staging \
            ./platform
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:staging-${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:staging

      - name: Deploy Frontend to Cloud Run staging
        run: |
          gcloud run deploy gifsy-frontend-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:staging-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=gifsy-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="NODE_ENV=production,EDGE_SECRET=${{ secrets.EDGE_SECRET }}" \
            --set-secrets="JWT_SECRET=JWT_SECRET_STAGING:latest,INTERNAL_PROXY_SECRET=INTERNAL_PROXY_SECRET_STAGING:latest"

  # ── Summary ──────────────────────────────────────────────────────────────────
  summary:
    name: Staging summary
    needs: [deploy-api-staging, deploy-frontend-staging]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "✅  Staging deployment complete"
          echo "    SHA: ${{ github.sha }}"
          echo ""
          echo "Staging URLs (after DNS setup):"
          echo "    API      : https://api.staging.gifsy.in"
          echo "    Platform : https://staging.platform.gifsy.in"
          echo ""
          echo "ℹ️  Staging uses FIXED_OTP=123456 for fast UAT (ALLOW_FIXED_OTP=true; gated to the gifsy_staging DB only — never prod). Flip ALLOW_FIXED_OTP back to unset here to return to real MSG91 OTP."
