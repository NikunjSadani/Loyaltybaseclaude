name: Deploy — Production (main)

on:
  # MANUAL-ONLY production deploy (the deploy gate). We intentionally do NOT deploy
  # on push to main: the GitHub Environment "production" required-reviewers gate is
  # NOT enforced on a PRIVATE repo on the Free plan (it only enforces on public repos,
  # or on Pro/Team/Enterprise for private) — so after the repo went private the gate
  # stopped pausing and a push to main auto-shipped to prod. Making prod deploy
  # workflow_dispatch-only restores a hard gate on ANY plan: prod ships ONLY when a
  # human clicks Actions → "Deploy — Production (main)" → Run workflow. The `approve`
  # job below is kept (harmless no-op when the env gate isn't enforced; re-arms
  # automatically if the repo returns to public or upgrades to Pro/Team).
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency deploy only)"
        type: boolean
        default: false

env:
  PROJECT_ID: gifsy-platform
  REGION:     asia-south1
  AR_REPO:    gifsy-images
  SQL_INSTANCE: gifsy-platform:asia-south1:gifsy-db

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    if: ${{ !inputs.skip_tests }}
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, platform]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Each app generates from its OWN prisma/schema.prisma (platform + api each
        # have one post-split). The cross-app fallback (--schema=../api/prisma) was
        # removed in Phase S S7 — it was dead (both apps have a local schema). The
        # -f guard remains so the step no-ops cleanly if a schema is ever absent
        # (e.g. after S8 deletes platform's schema when it becomes a pure proxy FE).
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.app }}" = "api" ]; then
            npm test -- --forceExit --no-coverage
          else
            npm test
          fi
        env:
          DATABASE_URL: "postgresql://test:test@127.0.0.1:5432/test"
          JWT_SECRET: "ci-test-secret"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          NODE_ENV: test

  # ── Production approval gate ─────────────────────────────────────────────────
  # GitHub Environment "production" has protection rules set in repo Settings →
  # Environments → production → Required reviewers.
  # Any push to main pauses here until a required reviewer approves.
  approve:
    name: Await production approval
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    environment: production        # ← triggers the approval gate
    steps:
      - run: echo "Production deployment approved."

  # ── GCP Auth (shared across deploy jobs) ─────────────────────────────────────
  # Both deploy jobs need this but GitHub Actions doesn't support sharing steps.
  # We re-auth in each job — it's fast (seconds).

  # ── Build & Deploy API ───────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → gifsy-api
    needs: approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # PREFLIGHT — runs FIRST, before the image build and BEFORE the prod DB migrations. Every secret the
      # "Deploy API to Cloud Run" step binds via --set-secrets that is NEW in this release must already exist
      # with an ENABLED latest version; otherwise fail HERE, with nothing changed on prod (no migration run,
      # no new API revision, and deploy-frontend — which needs deploy-api — never starts).
      # METADATA-ONLY: `gcloud secrets versions describe` reads a version's state, NEVER its value. The
      # deployer SA (GCP_SA_KEY = gifsy-deployer) needs roles/secretmanager.viewer for this (metadata only,
      # no secret payload access) — terraform/iam.tf `deployer_secret_viewer`; one-time gcloud grant in
      # platform/docs/plans/BAJAJ-PROD-GO-LIVE-CHECKLIST.md § F3 runbook.
      - name: Preflight — required Secret Manager secrets exist (metadata only)
        run: |
          missing=0
          for s in HUBBLE_CLIENT_ID HUBBLE_CLIENT_SECRET HUBBLE_WEBHOOK_SECRET SALES_IMPORT_DRAIN_SECRET NOTIFICATIONS_STATUS_SECRET VOUCHER_DISPERSAL_DRAIN_SECRET HUBBLE_SWEEP_SECRET INTERNAL_PROXY_SECRET; do
            state="$(gcloud secrets versions describe latest --secret="$s" --project="${{ env.PROJECT_ID }}" --format='value(state)' 2>/dev/null || true)"
            if [ "$state" != "ENABLED" ]; then
              echo "::error::Secret Manager secret '$s' is missing, has no ENABLED latest version, or is not visible to the deployer SA (needs roles/secretmanager.viewer). Create it (owner, console) BEFORE deploying — see BAJAJ-PROD-GO-LIVE-CHECKLIST.md § F3 runbook. Nothing was deployed or migrated."
              missing=1
            else
              echo "ok: $s (latest version ENABLED)"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push API image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:latest \
            ./api
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:latest

      # Apply DB migrations BEFORE the new revision serves (mirrors deploy-staging.yml).
      # gifsy_prod was reconciled to an empty DB at the 2026-06-20 cutover, so the squashed
      # baseline applies cleanly via `migrate deploy`. SHA-pinned image; --wait fails the deploy
      # if the migration fails (so broken-schema code never serves).
      - name: Run DB migrations (production)
        run: |
          gcloud run jobs deploy gifsy-migrate \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=npx \
            --args=prisma,migrate,deploy \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --execute-now --wait

      # SALES IMPORT worker (prod) — owner-approved 2026-11-11 (mirrors deploy-staging.yml). Deployed from the SAME
      # image as the API (never a stale worker), AFTER the migrations (the worker needs the sales-import tables).
      # No --execute-now: the API starts executions via jobs/gifsy-sales-import:run (SALES_IMPORT_RUNNER=job) and the
      # Cloud Scheduler drain (sales-import-drain, */10) is the fallback. One-time owner-approved infra AFTER the first
      # deploy creates the job: roles/run.jobsExecutor for gifsy-api-sa ON THIS JOB + the Scheduler job — see
      # platform/docs/plans/SALES-IMPORT-PIPELINE-PLAN.md §14. Sales Import stays OFF for every tenant until switched on.
      - name: Deploy Sales Import worker job (production)
        run: |
          gcloud run jobs deploy gifsy-sales-import \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=node \
            --args=--max-old-space-size=1700,dist/sales-import/worker.main.js \
            --memory=2Gi \
            --cpu=1 \
            --task-timeout=3600 \
            --max-retries=1 \
            --tasks=1 \
            --set-env-vars="NODE_ENV=production,GCP_REGION=${{ env.REGION }},NODE_OPTIONS=--max-old-space-size=1700,SALES_RETENTION_V2=on" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,GCS_BUCKET=GCS_BUCKET:latest,GCP_PROJECT_ID=GCP_PROJECT_ID:latest" \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # DOWNLOADS worker (prod) — platform/docs/plans/DOWNLOADS-PAGE.md. Mirrors the Sales Import worker job above
      # (same image, network, Cloud SQL, SA, 2Gi + heap 1700), deploy-only. The API starts executions via
      # jobs/gifsy-exports:run (EXPORTS_RUNNER=job). Uses ONLY existing secrets (JWT_SECRET: Outlet Master embeds
      # signed document links) — nothing to add to the PREFLIGHT list. The NEXT step grants roles/run.jobsExecutor for
      # gifsy-api-sa ON THIS JOB (idempotent); without it every heavy request FAILS at once (runbook in DOWNLOADS-PAGE.md).
      - name: Deploy Downloads worker job (production)
        run: |
          gcloud run jobs deploy gifsy-exports \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --command=node \
            --args=--max-old-space-size=1700,dist/exports/worker.main.js \
            --memory=2Gi \
            --cpu=1 \
            --task-timeout=3600 \
            --max-retries=1 \
            --tasks=1 \
            --set-env-vars="NODE_ENV=production,GCP_REGION=${{ env.REGION }},NODE_OPTIONS=--max-old-space-size=1700" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,GCS_BUCKET=GCS_BUCKET:latest,GCP_PROJECT_ID=GCP_PROJECT_ID:latest,JWT_SECRET=JWT_SECRET:latest" \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --set-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --service-account=gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # ⚠️ OWNER APPROVAL REQUIRED before this lands (IAM change on PROD GCP): lets the API (gifsy-api-sa) START
      # executions of the Downloads job — and nothing else (scoped to THIS job only; mirrors the grant already on
      # gifsy-sales-import). Idempotent (re-adding an existing binding is a no-op); the deployer holds roles/run.admin,
      # which includes run.jobs.setIamPolicy.
      - name: Allow the API to start the Downloads worker job (production)
        run: |
          gcloud run jobs add-iam-policy-binding gifsy-exports \
            --region=${{ env.REGION }} \
            --member=serviceAccount:gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --role=roles/run.jobsExecutor \
            --quiet

      # ════════════════════════════════════════════════════════════════════════════════════════
      # ⚠️⚠️ HUBBLE MONEY (prod) — THE 3 SECRETS BELOW MUST EXIST IN SECRET MANAGER *BEFORE* THIS RUNS ⚠️⚠️
      #   HUBBLE_CLIENT_ID, HUBBLE_CLIENT_SECRET, HUBBLE_WEBHOOK_SECRET   (project gifsy-platform)
      #   + gifsy-api-sa@gifsy-platform.iam.gserviceaccount.com needs roles/secretmanager.secretAccessor
      #   on each. A missing secret is caught by the PREFLIGHT step at the top of this job (before the
      #   image build and the DB migrations), so nothing on prod changes. If one still slips past the
      #   preflight (e.g. deleted mid-run, or gifsy-api-sa lacks secretAccessor), this step fails AFTER
      #   the migrations already ran: the prod API (LIVE DEOLEO) stays on its previous revision against
      #   the migrated schema, and the frontend does NOT deploy (deploy-frontend needs deploy-api).
      #   The OWNER creates them in the console (values never pasted into chat/commits) — runbook:
      #   platform/docs/plans/BAJAJ-PROD-GO-LIVE-CHECKLIST.md § "F3 runbook — Hubble on prod".
      #   HUBBLE_BASE_URL=https://api.myhubble.money (prod Hubble) is set in --set-env-vars below.
      #   Credentials are PLATFORM-level (one Hubble account); a tenant only uses them when its
      #   features.hubbleVoucherEnabled flag is ON (Deoleo: OFF → no Hubble calls, no behaviour change).
      #   The webhook (/v1/hubble/webhook) is FAIL-CLOSED: it 403s unless HUBBLE_WEBHOOK_SECRET is set.
      # ════════════════════════════════════════════════════════════════════════════════════════
      # FUND RECONCILIATION — client low-balance e-mails (api/src/fund/fund.service.ts fundAlertTarget). --set-env-vars
      #   REPLACES the env list on every deploy, so the switch lives HERE, not on the service. OWNER DECIDES before cutover:
      #   FUND_ALERTS_LIVE=false → no client receives a low-balance e-mail (digest + client view say "switched off");
      #   FUND_ALERTS_LIVE=true  → e-mails go to each client's configured alert recipients (Mon–Sat, once a day while low).
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy gifsy-api \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=gifsy-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port=4000 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --cpu-throttling \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --clear-vpc-connector \
            --network=gifsy-vpc \
            --subnet=gifsy-subnet-asia-south1 \
            --vpc-egress=private-ranges-only \
            --startup-probe=httpGet.path=/health/ready,httpGet.port=4000,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=30 \
            --set-env-vars="NODE_ENV=production,GCP_REGION=${{ env.REGION }},PLATFORM_DOMAIN=gifsy.in,JWT_EXPIRES_IN=60m,POINTS_TO_INR_RATE=1,MIN_PAYOUT_AMOUNT_PAISE=10000,TDS_SINGLE_TRANSACTION_THRESHOLD_PAISE=3000000,TDS_ANNUAL_THRESHOLD_PAISE=10000000,TDS_RATE_WITH_PAN=1,TDS_RATE_WITHOUT_PAN=2,PUSH_WORKER_ENABLED=true,VAPID_SUBJECT=mailto:ops@gifsy.in,MSG91_WHATSAPP_NUMBER=917003202293,REPORTS_FROM_EMAIL=reports@notify.gifsy.in,HUBBLE_BASE_URL=https://api.myhubble.money,SALES_IMPORT_RUNNER=job,SALES_IMPORT_JOB=gifsy-sales-import,EXPORTS_RUNNER=job,EXPORTS_JOB=gifsy-exports,DELIVERY_RECEIPTS_ENABLED=true,NOTIFICATIONS_RETENTION_ENABLED=true,SALES_RETENTION_V2=on,HUBBLE_ORDER_SWEEP_ENABLED=false,GCP_PROJECT=${{ env.PROJECT_ID }},FUND_ALERTS_LIVE=false" \
            --set-secrets="\
              DATABASE_URL=DATABASE_URL:latest,\
              JWT_SECRET=JWT_SECRET:latest,\
              INTERNAL_PROXY_SECRET=INTERNAL_PROXY_SECRET:latest,\
              MSG91_AUTH_KEY=MSG91_AUTH_KEY:latest,\
              MSG91_SENDER_ID=MSG91_SENDER_ID:latest,\
              MSG91_OTP_TEMPLATE_ID=MSG91_OTP_TEMPLATE_ID:latest,\
              MSG91_SMS_TEMPLATE_ID=MSG91_SMS_TEMPLATE_ID:latest,\
              MSG91_SMTP_PASS=MSG91_SMTP_PASS:latest,\
              REPORTS_RUN_SECRET=REPORTS_RUN_SECRET:latest,\
              GCS_BUCKET=GCS_BUCKET:latest,\
              GCP_PROJECT_ID=GCP_PROJECT_ID:latest,\
              CORS_ORIGINS=CORS_ORIGINS:latest,\
              VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,\
              VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,\
              PUSH_DRAIN_SECRET=PUSH_DRAIN_SECRET:latest,\
              EXPIRE_SWEEP_SECRET=EXPIRE_SWEEP_SECRET:latest,\
              KYC_CLEANUP_SECRET=KYC_CLEANUP_SECRET:latest,\
              VISIBILITY_REMINDER_SECRET=VISIBILITY_REMINDER_SECRET:latest,\
              HUBBLE_CLIENT_ID=HUBBLE_CLIENT_ID:latest,\
              HUBBLE_CLIENT_SECRET=HUBBLE_CLIENT_SECRET:latest,\
              HUBBLE_WEBHOOK_SECRET=HUBBLE_WEBHOOK_SECRET:latest,\
              SALES_IMPORT_DRAIN_SECRET=SALES_IMPORT_DRAIN_SECRET:latest,\
              NOTIFICATIONS_STATUS_SECRET=NOTIFICATIONS_STATUS_SECRET:latest,\
              VOUCHER_DISPERSAL_DRAIN_SECRET=VOUCHER_DISPERSAL_DRAIN_SECRET:latest,\
              HUBBLE_SWEEP_SECRET=HUBBLE_SWEEP_SECRET:latest"

  # ── Build & Deploy Frontend ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → gifsy-frontend
    # needs deploy-api: a failed API deploy must never ship a new frontend against the old API
    # (live Deoleo). The frontend build only starts once the API revision is serving.
    needs: [approve, deploy-api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_PWA_SW_ENABLED=true \
            --build-arg NEXT_PUBLIC_PWA_INSTALL_ENABLED=true \
            --build-arg NEXT_PUBLIC_PWA_PUSH_ENABLED=true \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest \
            ./platform
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:latest

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy gifsy-frontend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=gifsy-frontend-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=1 \
            --max-instances=10 \
            --cpu-throttling \
            --set-env-vars="NODE_ENV=production,EDGE_SECRET=${{ secrets.EDGE_SECRET }}" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,INTERNAL_PROXY_SECRET=INTERNAL_PROXY_SECRET:latest"

  # ── Post-deploy health check ─────────────────────────────────────────────────
  health-check:
    name: Health check
    needs: [deploy-api, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloud Run warmup
        run: sleep 15

      - name: Check API health
        run: |
          URL="${{ secrets.NEXT_PUBLIC_API_URL }}/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "API health: $STATUS"
          [[ "$STATUS" == "200" ]] || echo "⚠️  API health check returned $STATUS (may still be warming up)"

      - name: Deployment summary
        run: |
          echo "✅  Production deployment complete"
          echo "    API image    : ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}"
          echo "    Frontend image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/frontend:${{ github.sha }}"
